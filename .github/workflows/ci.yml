# =============================================================================
# CI — the same verification chain that has to pass locally.
#
# Deliberately does NOT deploy and does NOT need any secret: NADA builds and
# tests with no API key, because the local provider and the regex layer need
# none. If this workflow ever starts requiring a secret to go green, the
# no-cost path has been broken.
# =============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run icon

      - name: Typecheck (app)
        run: npx tsc --noEmit

      # Emits electron/*.cjs. Not --noEmit: package.json points "main" at
      # electron/main.cjs, so those files have to exist.
      - name: Typecheck and compile (Electron)
        run: npx tsc -p tsconfig.electron.json

      - name: Tests
        run: npx vitest run

      - name: Build (web / PWA)
        run: npx vite build

      - name: Confirm the no-key build produced a bundle
        run: test -f dist/index.html
