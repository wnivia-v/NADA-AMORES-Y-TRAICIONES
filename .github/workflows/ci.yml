# =============================================================================
# CI — the same verification chain that has to pass locally.
#
# Deliberately does NOT deploy and does NOT need any secret: NADA builds and
# tests with no API key, because the local provider and the regex layer need
# none. If this workflow ever starts requiring a secret to go green, the
# no-cost path has been broken.
# =============================================================================

name: CI

# `push` solo sobre main. Antes era ['**'], y como `pull_request` tambien
# dispara, cada empujon a una rama con PR abierta lanzaba DOS ejecuciones
# identicas: el doble de minutos de runner y dos checks que dicen lo mismo.
# No las deduplica el grupo de concurrencia porque github.ref vale distinto en
# cada evento (refs/heads/<rama> frente a refs/pull/<n>/merge), asi que caen en
# grupos distintos y ninguna cancela a la otra.
#
# Lo que se pierde: una rama SIN PR abierta ya no tiene CI automatica. Para eso
# esta workflow_dispatch, que se puede lanzar a mano sobre cualquier rama.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En una PR, un commit nuevo deja obsoleta la ejecucion anterior: cancelarla
  # es lo correcto. En main NO: cada commit que aterriza tiene que quedar
  # verificado por si mismo, y si dos entran seguidos, cancelar el primero deja
  # un commit de main sin comprobar nunca.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run icon

      # El cliente de Prisma es codigo GENERADO: vive en node_modules y no se
      # versiona. Sin este paso, `tx` y `row` en server/src/store/prisma.ts
      # quedan como `any` implicito y el typecheck falla — que es justo lo que
      # paso, y solo aqui: en local pasaba porque el cliente ya estaba generado.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (app)
        run: npx tsc --noEmit

      # El backend NO se comprobaba en CI, y ya me mordio dos veces en local.
      # Un typecheck que no cubre la mitad del codigo da una confianza que no
      # corresponde.
      - name: Typecheck (backend + modulo compartido)
        run: npx tsc -p tsconfig.server.json

      - name: Lint
        run: npm run lint

      # Emits electron/*.cjs. Not --noEmit: package.json points "main" at
      # electron/main.cjs, so those files have to exist.
      - name: Typecheck and compile (Electron)
        run: npx tsc -p tsconfig.electron.json

      - name: Tests
        run: npx vitest run

      # `npm run build` y no `npx vite build`: el primero ejecuta el prebuild,
      # que prepara el runtime de MediaPipe y compila el worker de vision. Con
      # `vite build` a secas la CI salia verde con un bundle SIN escudo de
      # video — verde no significaba desplegable.
      - name: Build (web / PWA)
        run: npm run build

      - name: Confirm the no-key build produced a usable bundle
        run: |
          test -f dist/index.html
          test -f dist/vision-worker.js
          test -f dist/mediapipe/face_landmarker.task
          test -f dist/mediapipe/wasm/vision_wasm_internal.wasm
